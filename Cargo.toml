[package]
name = "iota"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"           # inkwell 0.10 requires it

[dependencies]
# --- front end -------------------------------------------------------------
logos = "0.16.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ariadne = "0.6"                 # every diagnostic from every stage is rendered with this
clap = { version = "4", features = ["derive", "env"] }

# --- LLVM backend ------------------------------------------------------------
# inkwell 0.10 (2026-08) with LLVM 22.1. Needs an LLVM 22.1 install that
# `llvm-config` can find (or set LLVM_SYS_221_PREFIX=/path/to/llvm-22).
inkwell = { version = "0.10", features = ["llvm22-1"] }
im = "15.1.0"

[profile.release]
opt-level = 3
